name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Verify release metadata and dependency pins
        run: python scripts/verify_release.py

      - name: Run tests
        run: python -m pytest --strict-config --strict-markers

      - name: Compile application modules
        run: python -m compileall -q app

      - name: Validate Alembic revision graph
        run: |
          python -m alembic heads
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); assert len(heads) == 1, f'Expected exactly one Alembic head, found {len(heads)}: {heads}'"
