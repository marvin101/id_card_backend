name: SQLAlchemy 2.1 Compatibility

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sqlalchemy-21:
    # SQLAlchemy 2.1 remains a release candidate. Surface regressions without
    # blocking production releases, which remain pinned to SQLAlchemy 2.0.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Override only SQLAlchemy with 2.1 RC2
        run: python -m pip install --upgrade --pre "SQLAlchemy==2.1.0rc2"

      - name: Verify compatibility environment
        run: |
          python -m pip check
          python -c "import sqlalchemy; assert sqlalchemy.__version__ == '2.1.0rc2', sqlalchemy.__version__"

      - name: Run tests
        run: python -m pytest

      - name: Compile application modules
        run: python -m compileall app

      - name: Validate Alembic revision graph
        run: python -m alembic heads
