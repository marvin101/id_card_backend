name: SQLAlchemy 2.1 Compatibility

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-sqlalchemy-21:
    # Surface regressions without blocking production releases, which remain
    # pinned to the reviewed SQLAlchemy 2.0 line.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install production and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Override only SQLAlchemy with the latest 2.1 release
        run: python -m pip install --upgrade "SQLAlchemy>=2.1,<2.2"

      - name: Verify compatibility environment
        run: |
          python -m pip check
          python -c "import sqlalchemy; assert sqlalchemy.__version__.split('.')[:2] == ['2', '1'], sqlalchemy.__version__"

      - name: Run tests
        run: python -m pytest --strict-config --strict-markers

      - name: Compile application modules
        run: python -m compileall -q app

      - name: Validate Alembic revision graph
        run: python -m alembic heads
